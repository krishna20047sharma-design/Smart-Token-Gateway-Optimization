<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Token Optimization Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --panel-bg: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --hit: #22c55e;
            --hit-bg: rgba(34, 197, 94, 0.12);
            --miss: #f59e0b;
            --miss-bg: rgba(245, 158, 11, 0.12);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        header {
            text-align: center;
            padding-bottom: 4px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        /* Chat Container Box */
        .chat-box {
            flex: 1;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--text-main);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border);
            color: #cbd5e1;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            white-space: pre-wrap;
        }

        .placeholder-text {
            color: var(--text-sub);
            text-align: center;
            margin: auto;
            font-size: 0.9rem;
        }

        /* Bottom Metrics & Input Section */
        .bottom-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Metrics Bar */
        .metrics-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .metric-item {
            text-align: center;
        }

        .metric-label {
            font-size: 0.7rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .metric-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-hit { background: var(--hit-bg); color: var(--hit); border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge-miss { background: var(--miss-bg); color: var(--miss); border: 1px solid rgba(245, 158, 11, 0.3); }

        /* Input Form */
        .input-form {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 0.92rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        button {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #fff;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Smart Token Optimization Gateway</h1>
        <p>Semantic Caching & Real-Time Performance Monitor</p>
    </header>

    <!-- Chat Messages Box -->
    <div class="chat-box" id="chatBox">
        <div class="placeholder-text" id="placeholder">Ask a question to test the semantic gateway...</div>
    </div>

    <!-- Bottom Panel: Metrics + Input Box -->
    <div class="bottom-panel">
        <div class="metrics-bar">
            <div class="metric-item">
                <div class="metric-label">Cache Status</div>
                <div class="metric-val" id="statusVal">-</div>
            </div>
            <div class="metric-item">
                <div class="metric-label">Total Latency</div>
                <div class="metric-val" id="latencyVal">-</div>
            </div>
            <div class="metric-item">
                <div class="metric-label">Semantic Match</div>
                <div class="metric-val" id="matchVal">-</div>
            </div>
        </div>

        <form class="input-form" id="queryForm">
            <input type="text" id="promptInput" placeholder="Type your prompt here..." required autocomplete="off">
            <button type="submit" id="sendBtn">Send</button>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById('queryForm');
    const promptInput = document.getElementById('promptInput');
    const chatBox = document.getElementById('chatBox');
    const placeholder = document.getElementById('placeholder');
    const sendBtn = document.getElementById('sendBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const promptText = promptInput.value.trim();
        if (!promptText) return;

        if (placeholder) {
            placeholder.remove();
        }

        // Append User Message
        const userMsg = document.createElement('div');
        userMsg.className = 'message user-message';
        userMsg.textContent = promptText;
        chatBox.appendChild(userMsg);

        promptInput.value = '';
        sendBtn.disabled = true;
        sendBtn.textContent = '...';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const res = await fetch('/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: promptText })
            });
            const data = await res.json();

            if (res.ok) {
                // Update Bottom Metrics Box
                document.getElementById('statusVal').innerHTML = data.cached 
                    ? '<span class="badge badge-hit">HIT</span>' 
                    : '<span class="badge badge-miss">MISS</span>';
                document.getElementById('latencyVal').textContent = `${data.latency_ms} ms`;
                document.getElementById('matchVal').textContent = `${(data.similarity_score * 100).toFixed(1)}%`;

                // Append AI Response Message
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai-message';
                aiMsg.textContent = data.response;
                chatBox.appendChild(aiMsg);
            } else {
                const errMsg = document.createElement('div');
                errMsg.className = 'message ai-message';
                errMsg.style.color = '#f87171';
                errMsg.textContent = `Error: ${data.detail || 'Failed to process request'}`;
                chatBox.appendChild(errMsg);
            }
        } catch (err) {
            const errDiv = document.createElement('div');
            errDiv.className = 'message ai-message';
            errDiv.style.color = '#f87171';
            errDiv.textContent = `Connection Error: ${err.message}`;
            chatBox.appendChild(errDiv);
        } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    });
</script>

</body>
</html>
